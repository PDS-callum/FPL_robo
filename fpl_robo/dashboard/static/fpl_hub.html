<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FPL Hub · FPL Robo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap" />
  <style>
    :root {
      --ink: #0c1a24;
      --muted: #5a6d7a;
      --paper: #e4ecf4;
      --paper-2: #f1f5fa;
      --pitch: #0f766e;
      --pitch-deep: #134e4a;
      --lime: #2dd4bf;
      --warn: #c47a1a;
      --bad: #c2414b;
      --good: #0f766e;
      --line: rgba(12, 26, 36, 0.12);
      --glass: rgba(255,255,255,0.55);
      --glass-strong: rgba(255,255,255,0.78);
      --shadow: 0 12px 32px rgba(12, 26, 36, 0.1);
    }
    * { box-sizing: border-box; scrollbar-width: thin; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: "Sora", system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 8% -8%, rgba(45, 212, 191, 0.22), transparent 55%),
        radial-gradient(800px 480px at 100% 0%, rgba(15, 118, 110, 0.14), transparent 50%),
        linear-gradient(168deg, var(--paper) 0%, var(--paper-2) 50%, #d5e0ea 100%);
      background-attachment: fixed;
    }
    .wrap {
      width: min(1180px, calc(100% - 1.5rem));
      margin: 0 auto;
      padding: 0.75rem 0 2.25rem;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem 1rem;
      margin-bottom: 0.85rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px solid rgba(15, 118, 110, 0.18);
    }
    .brand {
      font-family: "Syne", system-ui, sans-serif;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
      color: var(--pitch-deep);
      text-decoration: none;
    }
    .brand span { color: var(--pitch); font-weight: 700; }
    .top-links { display: flex; gap: 0.35rem; margin-left: auto; flex-wrap: wrap; }
    .top-links a {
      padding: 0.38rem 0.65rem;
      border-radius: 0.35rem;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--pitch-deep);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .top-links a.is-here {
      background: rgba(45, 212, 191, 0.28);
      border-color: rgba(15, 118, 110, 0.22);
    }
    .hero {
      display: grid;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }
    @media (min-width: 720px) {
      .hero { grid-template-columns: 1.35fr auto; align-items: end; }
    }
    h1 {
      font-family: "Syne", system-ui, sans-serif;
      font-size: clamp(1.55rem, 3.5vw, 2rem);
      margin: 0 0 0.2rem;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
      max-width: 36rem;
    }
    .snap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: flex-end;
    }
    .snap-pill {
      padding: 0.45rem 0.7rem;
      background: var(--glass-strong);
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      min-width: 5.5rem;
    }
    .snap-pill .k {
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .snap-pill .v {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--pitch-deep);
      margin-top: 0.1rem;
    }

    .hub-tabs {
      display: flex;
      gap: 0.25rem;
      margin: 0 0 1rem;
      padding: 0.2rem;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.4);
      border-radius: 0.5rem;
      overflow-x: auto;
      max-width: 100%;
    }
    .hub-tabs button {
      flex: 1 1 auto;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.52rem 0.7rem;
      border-radius: 0.35rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .hub-tabs button.is-active {
      background: rgba(45, 212, 191, 0.3);
      color: var(--pitch-deep);
      border: 1px solid rgba(15, 118, 110, 0.2);
    }
    .hub-pane { display: none; }
    .hub-pane.is-active { display: block; }

    .section-label {
      margin: 0 0 0.55rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .trend-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 1.15rem;
    }
    @media (max-width: 800px) {
      .trend-grid { grid-template-columns: 1fr; }
    }
    .trend-card {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.75rem 0.85rem 0.85rem;
      box-shadow: var(--shadow);
    }
    .trend-card h3 {
      margin: 0 0 0.15rem;
      font-family: "Syne", system-ui, sans-serif;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }
    .trend-card .hint {
      margin: 0 0 0.65rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.3;
    }
    .trend-card.tone-up { border-top: 3px solid var(--good); }
    .trend-card.tone-down { border-top: 3px solid var(--bad); }
    .trend-card.tone-hot { border-top: 3px solid #ea580c; }
    .trend-card.tone-cold { border-top: 3px solid #64748b; }
    .trend-card.tone-neutral { border-top: 3px solid var(--pitch); }

    .trow {
      display: grid;
      grid-template-columns: 1.4rem minmax(0, 1fr) auto;
      gap: 0.45rem;
      align-items: center;
      padding: 0.38rem 0;
      border-top: 1px solid rgba(12, 26, 36, 0.07);
    }
    .trow:first-of-type { border-top: 0; padding-top: 0; }
    .trow .rank {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 500;
    }
    .trow .who {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.25rem 0.4rem;
    }
    .trow .nm { font-weight: 600; font-size: 0.88rem; color: var(--pitch-deep); }
    .trow .meta { font-size: 0.72rem; color: var(--muted); }
    .trow .val {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.82rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }
    .trow .val.up { color: var(--good); }
    .trow .val.down { color: var(--bad); }
    .trow .val.hot { color: #c2410c; }
    .trow .bar {
      grid-column: 2 / -1;
      height: 0.28rem;
      background: rgba(12, 26, 36, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: -0.1rem;
      margin-bottom: 0.15rem;
    }
    .trow .bar > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--pitch), var(--lime));
      border-radius: inherit;
    }
    .trow.owned .nm::after {
      content: "you";
      margin-left: 0.35rem;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--pitch);
      background: rgba(45, 212, 191, 0.25);
      padding: 0.08rem 0.3rem;
      border-radius: 0.25rem;
    }

    .run-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 1.15rem;
    }
    @media (max-width: 720px) {
      .run-grid { grid-template-columns: 1fr; }
    }
    .run-list { display: grid; gap: 0.45rem; }
    .run-row {
      display: grid;
      grid-template-columns: 3rem minmax(0, 1fr) 2.6rem;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem 0.6rem;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 0.4rem;
    }
    .run-row .club { font-weight: 700; color: var(--pitch-deep); }
    .run-row .ease {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: right;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .fdr-chip {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 2.15rem;
      height: 2.15rem;
      padding: 0.1rem 0.2rem;
      border-radius: 0.28rem;
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1.05;
      color: #0c1a24;
    }
    .fdr-chip .ha { opacity: 0.65; font-size: 0.55rem; }
    .fdr-chip.fdr-1 { background: #01fc75; }
    .fdr-chip.fdr-2 { background: #66f27a; }
    .fdr-chip.fdr-3 { background: #e7e34c; }
    .fdr-chip.fdr-4 { background: #ff7a4d; }
    .fdr-chip.fdr-5 { background: #ff1751; color: #fff; }
    .fdr-chip.blank { background: rgba(12,26,36,0.08); color: var(--muted); }

    .alert-list { display: grid; gap: 0.4rem; margin-bottom: 0.5rem; }
    .alert {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.55rem;
      align-items: center;
      padding: 0.55rem 0.7rem;
      background: var(--glass);
      border: 1px solid var(--line);
      border-left: 3px solid var(--pitch);
      border-radius: 0 0.35rem 0.35rem 0;
    }
    .alert.is-owned { border-left-color: var(--lime); background: rgba(45, 212, 191, 0.1); }
    .alert .nm { font-weight: 600; color: var(--pitch-deep); }
    .alert .meta { font-size: 0.75rem; color: var(--muted); }

    .squad-fx-list { display: grid; gap: 0.4rem; margin-bottom: 0.35rem; }
    .squad-fx-row {
      display: grid;
      grid-template-columns: minmax(7rem, 1.1fr) minmax(0, 1.4fr) 2.6rem;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem 0.65rem;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 0.4rem;
    }
    .squad-fx-row .who { min-width: 0; }
    .squad-fx-row .nm { font-weight: 600; color: var(--pitch-deep); display: block; }
    .squad-fx-row .meta { font-size: 0.72rem; color: var(--muted); }
    .squad-fx-row .ease {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: right;
    }
    @media (max-width: 720px) {
      .squad-fx-row { grid-template-columns: 1fr auto; }
      .squad-fx-row .ease { display: none; }
      .squad-fx-row .chip-row { grid-column: 1 / -1; }
    }

    .bd-list { display: grid; gap: 0.4rem; }
    .bd-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.55rem;
      align-items: center;
      padding: 0.5rem 0.7rem;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      font-size: 0.85rem;
    }
    .bd-row.muted { color: var(--muted); font-size: 0.8rem; }

    .flag {
      display: inline-flex;
      align-items: center;
      padding: 0.12rem 0.4rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 0.25rem;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.5);
    }
    .flag.rise, .flag.hot, .flag.easy { color: var(--good); border-color: rgba(15,118,110,0.3); background: rgba(45,212,191,0.15); }
    .flag.fall, .flag.cold, .flag.hard, .flag.doubt, .flag.status, .flag.news {
      color: var(--bad); border-color: rgba(194,65,75,0.3); background: rgba(194,65,75,0.08);
    }

    .hub-gw-block { margin-bottom: 1.2rem; }
    .hub-gw-block h3 {
      margin: 0 0 0.5rem;
      font-family: "Syne", system-ui, sans-serif;
      font-size: 1.1rem;
    }
    .fx-list { display: grid; gap: 0.4rem; }
    .fx-row {
      display: grid;
      grid-template-columns: minmax(4.2rem, auto) 1fr auto 1fr;
      gap: 0.5rem 0.65rem;
      align-items: center;
      padding: 0.6rem 0.75rem;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 0.4rem;
    }
    .fx-row .kick { font-size: 0.7rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .fx-row .side { display: flex; align-items: center; gap: 0.35rem; min-width: 0; }
    .fx-row .side.home { justify-content: flex-end; text-align: right; }
    .fx-row .tname { font-weight: 600; font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fx-row .score-mid {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      min-width: 3rem;
      text-align: center;
      font-weight: 500;
      color: var(--pitch-deep);
    }
    .fx-row .score-mid.vs { color: var(--muted); font-size: 0.75rem; }
    .fdr-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.25rem;
      height: 1.25rem;
      border-radius: 0.22rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      font-weight: 600;
      color: #0c1a24;
    }
    .fdr-dot.fdr-1 { background: #01fc75; }
    .fdr-dot.fdr-2 { background: #66f27a; }
    .fdr-dot.fdr-3 { background: #e7e34c; }
    .fdr-dot.fdr-4 { background: #ff7a4d; }
    .fdr-dot.fdr-5 { background: #ff1751; color: #fff; }

    .fdr-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.7rem;
      margin: 0 0 0.65rem;
      font-size: 0.74rem;
      color: var(--muted);
      align-items: center;
    }
    .fdr-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--glass);
      border-radius: 0.4rem;
    }
    .fdr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      min-width: 36rem;
    }
    .fdr-table th, .fdr-table td {
      padding: 0.32rem 0.35rem;
      text-align: center;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .fdr-table th {
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      position: sticky;
      top: 0;
      background: rgba(241,245,250,0.96);
      z-index: 1;
    }
    .fdr-table td.team, .fdr-table th.team {
      text-align: left;
      font-weight: 600;
      color: var(--pitch-deep);
      position: sticky;
      left: 0;
      background: rgba(241,245,250,0.97);
      z-index: 2;
    }
    .fdr-table th.team { z-index: 3; }
    .fdr-table td.ease {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: var(--muted);
    }
    .fdr-table tr.is-easiest td {
      background: rgba(1, 252, 117, 0.12);
    }
    .fdr-table tr.is-hardest td {
      background: rgba(255, 23, 81, 0.08);
    }
    .fdr-table tr.is-easiest td.team,
    .fdr-table tr.is-hardest td.team {
      background: inherit;
    }
    .fdr-table th.is-run-window {
      color: var(--pitch-deep);
      box-shadow: inset 0 -3px 0 rgba(15, 118, 110, 0.55);
    }
    .fdr-table td.is-run-window {
      background: rgba(15, 118, 110, 0.04);
    }
    .fdr-table tr.is-easiest td.is-run-window {
      background: rgba(1, 252, 117, 0.16);
    }
    .fdr-table tr.is-hardest td.is-run-window {
      background: rgba(255, 23, 81, 0.1);
    }
    .fdr-table--blocks td {
      padding: 0.28rem 0.12rem;
    }
    .fdr-table--blocks td.in-run-easy {
      background: rgba(1, 252, 117, 0.14);
    }
    .fdr-table--blocks td.in-run-hard {
      background: rgba(255, 23, 81, 0.1);
    }
    .fdr-table--blocks td.in-run .fdr-cell {
      width: 100%;
      min-width: 2.55rem;
    }
    .run-summary {
      display: inline-block;
      margin-left: 0.35rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.01em;
      vertical-align: middle;
    }
    .fdr-cell {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 2.7rem;
      min-height: 2.25rem;
      padding: 0.15rem;
      border-radius: 0.25rem;
      font-weight: 600;
      line-height: 1.1;
      color: #0c1a24;
      position: relative;
    }
    .fdr-cell .opp { font-size: 0.66rem; }
    .fdr-cell .ha { font-size: 0.55rem; opacity: 0.7; }
    .fdr-cell.fdr-1 { background: #01fc75; }
    .fdr-cell.fdr-2 { background: #66f27a; }
    .fdr-cell.fdr-3 { background: #e7e34c; }
    .fdr-cell.fdr-4 { background: #ff7a4d; }
    .fdr-cell.fdr-5 { background: #ff1751; color: #fff; }
    .fdr-cell.blank { background: rgba(12,26,36,0.06); color: var(--muted); font-size: 0.65rem; }
    .fdr-cell.run-easy {
      box-shadow:
        0 0 0 2px #0f766e,
        inset 0 0 0 1px rgba(255,255,255,0.25);
      z-index: 1;
    }
    .fdr-cell.run-hard {
      box-shadow:
        0 0 0 2px #9f1239,
        inset 0 0 0 1px rgba(255,255,255,0.15);
      z-index: 1;
    }
    .fdr-cell.run-easy.run-start,
    .fdr-cell.run-hard.run-start {
      border-radius: 0.4rem 0.12rem 0.12rem 0.4rem;
      margin-left: 0.1rem;
    }
    .fdr-cell.run-easy.run-mid,
    .fdr-cell.run-hard.run-mid {
      border-radius: 0.1rem;
    }
    .fdr-cell.run-easy.run-end,
    .fdr-cell.run-hard.run-end {
      border-radius: 0.12rem 0.4rem 0.4rem 0.12rem;
      margin-right: 0.1rem;
    }
    .fdr-cell.run-easy.run-start.run-end,
    .fdr-cell.run-hard.run-start.run-end {
      border-radius: 0.4rem;
      margin: 0 0.1rem;
    }
    .fdr-cell.run-easy.run-mid,
    .fdr-cell.run-easy.run-end:not(.run-start) {
      box-shadow:
        -1px 0 0 1px #0f766e,
        0 0 0 2px #0f766e,
        inset 0 0 0 1px rgba(255,255,255,0.25);
    }
    .fdr-cell.run-hard.run-mid,
    .fdr-cell.run-hard.run-end:not(.run-start) {
      box-shadow:
        -1px 0 0 1px #9f1239,
        0 0 0 2px #9f1239,
        inset 0 0 0 1px rgba(255,255,255,0.15);
    }
    .team-badge {
      display: inline-block;
      margin-left: 0.35rem;
      padding: 0.08rem 0.32rem;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 0.2rem;
      vertical-align: middle;
    }
    .team-badge.easy {
      color: #065f46;
      background: rgba(1, 252, 117, 0.35);
    }
    .team-badge.hard {
      color: #9f1239;
      background: rgba(255, 23, 81, 0.18);
    }
    .fdr-run-key {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 1rem;
      margin: 0 0 0.75rem;
      font-size: 0.74rem;
      color: var(--muted);
      align-items: center;
    }
    .fdr-run-key .swatch {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .fdr-run-key .box {
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 0.2rem;
    }
    .fdr-run-key .box.easy {
      background: #66f27a;
      box-shadow: 0 0 0 2px #0f766e;
    }
    .fdr-run-key .box.hard {
      background: #ff7a4d;
      box-shadow: 0 0 0 2px #9f1239;
    }
    .fdr-run-key .box.window {
      display: none;
    }

    .hub-stats-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0 0 0.7rem;
