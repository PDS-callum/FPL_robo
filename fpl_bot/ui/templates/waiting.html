{% extends "base.html" %}

{% block title %}Waiting - Horizons{% endblock %}

{% block content %}
    <div class="card" style="text-align: center; padding: 40px 20px;">
        <!-- Modern Loading Animation -->
        <div class="loader-container" style="position: relative; margin: 0 auto 40px; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center;">
            <div class="spinner" style="width: 80px; height: 80px; border: 4px solid #e2e8f0; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <div class="spinner-inner" style="position: absolute; width: 60px; height: 60px; border: 4px solid #e2e8f0; border-top-color: #764ba2; border-radius: 50%; animation: spin 0.8s linear infinite reverse;"></div>
            <div class="spinner-core" style="position: absolute; width: 40px; height: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; animation: pulse 1.5s ease-in-out infinite;"></div>
        </div>
        
        <!-- Clean Loading Text -->
        <div class="loading-text-container">
            <h2 style="color: #667eea; margin-bottom: 15px; font-weight: 600;">
                <span class="loading-text">Analyzing Data</span>
                <span class="loading-dots" style="animation: dotsBlink 1.5s infinite;">...</span>
            </h2>
            <p style="color: #64748b; font-size: 0.95em;">Please wait while we process your information</p>
        </div>
    </div>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 1;
            }
            50% { 
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
        
        @keyframes dotsBlink {
            0%, 20% { opacity: 0; }
            50%, 100% { opacity: 1; }
        }
    </style>

    <script>
        // Auto-refresh every 2 seconds to check if report is ready
        setInterval(function() {
            fetch('/health')
                .then(response => response.json())
                .then(data => {
                    if (data.has_report) {
                        window.location.reload();
                    }
                })
                .catch(error => console.log('error: '));
        }, 2000);
    </script>
{% endblock %}
